services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-manager-backend
    expose:
      - "5050"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5050
    volumes:
      - ./backend/FinancialManager.API/FinancialManager.db:/app/FinancialManager.db
    networks:
      - app-network

  frontend:
    image: node:22-alpine
    container_name: financial-manager-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    expose:
      - "5173"
    volumes:
      - ./frontend/financial-manager-web:/app
    environment:
      VITE_API_URL: /api
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: financial-manager-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
